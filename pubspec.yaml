name: dealshare
description: A user-friendly grocery delivery mobile app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  go_router: ^12.1.3
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  badges: ^3.1.2
  carousel_slider: ^4.2.1
  shared_preferences: ^2.2.2
  shared_preferences_web: ^2.2.1
  intl: ^0.18.1
  flutter_keyboard_visibility_web: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
